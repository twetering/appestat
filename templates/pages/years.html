{% extends "base.html" %}
{% block title %}Jaren{% endblock %}
{% block content %}
<div class="page-head">
    <div>
        <h1>Jaren vergelijken</h1>
        <p class="sub">Hoe je uitgaven zich van jaar tot jaar ontwikkelen</p>
    </div>
</div>
<div id="filters"></div>
<section class="card"><div class="card-body flush" id="years-table"></div></section>
<section class="card" style="margin-top:1rem">
    <div class="card-head"><h2>Per maand, jaren naast elkaar</h2></div>
    <div class="card-body"><div class="chart-box" style="height:300px"><canvas id="month-chart" aria-label="Maanden per jaar"></canvas></div></div>
</section>
<section class="card" style="margin-top:1rem">
    <div class="card-head"><h2>Per categorie</h2></div>
    <div class="card-body flush" id="cat-table"></div>
</section>
{% endblock %}
{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/pages/years.js') }}?v={{ asset_version }}"></script>
{% endblock %}
