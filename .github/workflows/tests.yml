name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint (pyflakes rules on the v3 code)
        run: ruff check --select F app.py parser.py database.py api web services importers sources/plus_receipt.py sources/plus_llm.py
      - name: Tests
        env:
          OPENAI_API_KEY: ""  # tests never call the API
        run: pytest -q
